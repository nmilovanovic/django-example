<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Roster</title>
    <!-- Assuming Tailwind CLI is generating static/css/output.css or similar, but for now we can use CDN to be safe if local tailwind isn't built, or we assume it is. The instructions emphasize rich aesthetics, so I'll include CDN to guarantee it works immediately. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                Student Roster
            </h1>
            <div class="px-4 py-2 rounded-full bg-gray-800 border border-gray-700 shadow-lg text-sm text-gray-300 font-medium">
                {{ students|length }} Students Enrolled
            </div>
        </div>

        <div class="bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-700 transition-all duration-300 hover:shadow-2xl hover:border-gray-600">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-800/50 border-b border-gray-700 text-gray-400 text-sm uppercase tracking-wider">
                            <th class="px-6 py-5 font-semibold">First Name</th>
                            <th class="px-6 py-5 font-semibold">Last Name</th>
                            <th class="px-6 py-5 font-semibold">Grade</th>
                            <th class="px-6 py-5 font-semibold">Email</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-700/50">
                        {% for student in students %}
                        <tr class="hover:bg-gray-700/30 transition-colors duration-200 group">
                            <td class="px-6 py-4">
                                <div class="font-medium text-gray-200 group-hover:text-blue-400 transition-colors">{{ student.first_name }}</div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-gray-300">{{ student.last_name }}</div>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    {{ student.grade }}
                                </span>
                            </td>
                            <td class="px-6 py-4">
                                <a href="mailto:{{ student.email }}" class="text-gray-400 hover:text-white transition-colors flex items-center gap-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                    </svg>
                                    {{ student.email }}
                                </a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="4" class="px-6 py-12 text-center text-gray-500">
                                <div class="flex flex-col items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-4 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                                    </svg>
                                    <p class="text-lg">No students found.</p>
                                    <p class="text-sm mt-1">Please add students to the database.</p>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
