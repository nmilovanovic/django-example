{% extends "base.html" %}

{% block title %}Sign in to Merit{% endblock %}

{% block content %}
<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 relative overflow-hidden">
    <!-- Decorative background blobs -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-gradient-to-r from-indigo-300 to-purple-300 rounded-full blur-[100px] opacity-30 z-[-1]"></div>
    
    <div class="sm:mx-auto sm:w-full sm:max-w-md fade-in">
        <div class="flex justify-center mb-6">
            <div class="h-16 w-16 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl shadow-lg flex items-center justify-center transform hover:scale-105 transition-transform">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
        </div>
        <h2 class="mt-2 text-center text-3xl font-bold tracking-tight text-slate-900">Welcome to Merit</h2>
        <p class="mt-2 text-center text-sm text-slate-500">Sign in to submit or verify achievements</p>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px] fade-in" style="animation-delay: 0.1s; animation-fill-mode: both;">
        <div class="bg-white/80 backdrop-blur-xl px-6 py-12 shadow-[0_8px_30px_rgb(0,0,0,0.04)] ring-1 ring-slate-900/5 sm:rounded-2xl sm:px-12 border border-white">
            <form class="space-y-6" action="{% url 'merit:login' %}" method="POST">
                {% csrf_token %}
                
                <div>
                    <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium leading-6 text-slate-900">Email address</label>
                    <div class="mt-2 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
                        </div>
                        <input id="{{ form.username.id_for_label }}" name="{{ form.username.html_name }}" type="text" autocomplete="email" required class="block w-full rounded-xl border-0 py-3 pl-10 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 transition-shadow bg-white/50 focus:bg-white">
                    </div>
                </div>

                <div>
                    <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium leading-6 text-slate-900">Password</label>
                    <div class="mt-2 relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                        </div>
                        <input id="{{ form.password.id_for_label }}" name="{{ form.password.html_name }}" type="password" autocomplete="current-password" required class="block w-full rounded-xl border-0 py-3 pl-10 text-slate-900 shadow-sm ring-1 ring-inset ring-slate-300 placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6 transition-shadow bg-white/50 focus:bg-white">
                    </div>
                </div>

                <div>
                    <button type="submit" class="flex w-full justify-center rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 px-3 py-3.5 text-sm font-semibold text-white shadow-md hover:shadow-lg hover:from-indigo-500 hover:to-purple-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all transform active:scale-[0.98]">
                        Sign in
                    </button>
                </div>
            </form>
            
            <div class="mt-8 text-center text-sm text-slate-500">
                <p>Use your assigned school email to log in.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
